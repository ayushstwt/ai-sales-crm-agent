spring:
  application:
    name: ai-sales-crm-agent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salescrm}
    username: ${SPRING_DATASOURCE_USERNAME:salescrm_app}
    password: ${SPRING_DATASOURCE_PASSWORD:salescrm_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

azure:
  openai:
    api-key: ${AZURE_OPENAI_API_KEY:}
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://sharkdom-aditya-openai.openai.azure.com/}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-5-mini}
