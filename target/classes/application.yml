spring:
  application:
    name: ai-sales-crm-agent

  datasource:
    url: jdbc:postgresql://localhost:5432/salescrm
    username: salescrm_app
    password: salescrm_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
